# docker compose containers for nginx reverse proxy, shinyproxy, shiny app, flask api, and postgresql database.

services:

  nginx:
    image: nginx:1.28
    container_name: nginx
    restart: always
    volumes:
      # Mounted over the image's own default.conf rather than beside it.
      # That file declares server_name localhost, which would otherwise win
      # Host: localhost on an exact-name match and serve the nginx welcome
      # page instead of the app.
      - type: bind
        source: ./deploy/nginx/apps.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./deploy/nginx/html/
        target: /var/www/html/
      # Optional TLS termination at the origin. An empty certs/ dir mounts
      # fine and apps.conf's include of it matches nothing, so deployments
      # without a certificate keep running plain HTTP. To enable 443: create
      # a Cloudflare Origin Certificate, drop the cert, key and a 443.conf
      # snippet here (see deploy/nginx/apps.conf for the snippet), then
      # open 443 in the security group + ufw and restart this service.
      - type: bind
        source: ./deploy/nginx/certs/
        target: /etc/nginx/certs/
        read_only: true

    # No ports: mapping -- this service uses host networking, under which
    # Compose ignores ports:. The listen address is set in deploy/nginx/apps.conf.
    network_mode: 'host'

  shinyproxy:
    image: openanalytics/shinyproxy:3.2.4
    container_name: shinyproxy
    restart: always
    # Access to /var/run/docker.sock comes from the host docker group, whose
    # numeric gid is DOCKER_GID from .env. Never "fix" this with
    # chmod a+rw on the socket: dockerd recreates it 0660 root:docker on
    # every restart, the change evaporates, and every new visitor session
    # fails with 500 "Container failed to start" until someone re-chmods.
    group_add:
      - "${DOCKER_GID}"
    # Make the LEMUR_DB_* variables available to ShinyProxy's own process so it
    # can forward them to the app containers it spawns (via container-env in
    # deploy/shinyproxy/application.yml).
    # Only the runtime credentials -- deliberately not env_file: .env, which
    # would also hand this container POSTGRES_PASSWORD and LEMUR_DB_OWNER_PASSWORD.
    # Compose still reads .env for the ${...} substitutions below.
    environment:
      LEMUR_DB_HOST: ${LEMUR_DB_HOST}
      LEMUR_DB_NAME: ${LEMUR_DB_NAME}
      LEMUR_DB_USER: ${LEMUR_DB_USER}
      LEMUR_DB_PASSWORD: ${LEMUR_DB_PASSWORD}
      LEMUR_DB_PORT: ${LEMUR_DB_PORT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ./deploy/shinyproxy/application.yml
        target: /opt/shinyproxy/application.yml
        read_only: true
    ports:
      - 127.0.0.1:8080:8080
    security_opt:
      - no-new-privileges:true
    networks:
      - net

  # The shiny service runs the app in server mode against the postgres
  # container. The image is built locally (never pulled); rebuild with:
  #   docker compose --profile build build shiny
  shiny:
    container_name: shiny
    #image: ghcr.io/mpascariu/lemur-shiny:latest
    build: ./
    image: lemur_shiny:latest
    pull_policy: never
    profiles: ["build"]
    # Only the runtime credentials -- deliberately not env_file: .env, which
    # would also hand this container POSTGRES_PASSWORD and LEMUR_DB_OWNER_PASSWORD.
    # Compose still reads .env for the ${...} substitutions below.
    environment:
      LEMUR_DB_HOST: ${LEMUR_DB_HOST}
      LEMUR_DB_NAME: ${LEMUR_DB_NAME}
      LEMUR_DB_USER: ${LEMUR_DB_USER}
      LEMUR_DB_PASSWORD: ${LEMUR_DB_PASSWORD}
      LEMUR_DB_PORT: ${LEMUR_DB_PORT}
    command:
      - Rscript
      - -e
      - options(shiny.port=3838, shiny.host='0.0.0.0'); lemur::run_app(lb=FALSE, serverMode=TRUE)
    ports:
      - 127.0.0.1:3838:3838
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - net
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # One-shot loader: fills cod/sdg/lt directly from the .rds bundled in the
  # app image (DBI::dbWriteTable, no CSV files, no host R). Runs with:
  #   docker compose run --rm db-loader
  db-loader:
    #image: ghcr.io/mpascariu/lemur-shiny:latest
    build: ./
    image: lemur_shiny:latest
    pull_policy: never
    profiles: ["init", "build"]
    # The loader needs DDL, so it gets LEMUR_DB_OWNER -- but still not
    # POSTGRES_PASSWORD. LEMUR_DB_USER (no password) is only used to name the
    # grantee when re-granting SELECT on the reloaded tables.
    environment:
      LEMUR_DB_HOST: ${LEMUR_DB_HOST}
      LEMUR_DB_NAME: ${LEMUR_DB_NAME}
      LEMUR_DB_PORT: ${LEMUR_DB_PORT}
      LEMUR_DB_OWNER: ${LEMUR_DB_OWNER}
      LEMUR_DB_OWNER_PASSWORD: ${LEMUR_DB_OWNER_PASSWORD}
      LEMUR_DB_USER: ${LEMUR_DB_USER}
    entrypoint: ["bash", "/scripts/load_data.sh"]
    volumes:
      - ./deploy/postgresql/load_data.sh:/scripts/load_data.sh:ro
    networks:
      - net
    depends_on:
      - postgres
    restart: "no"

  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    # The only service that holds the superuser password: it needs it to
    # initialise, and init-db.sh needs the other two roles' credentials to
    # create them. init-db.sh then adds a pg_hba.conf rule rejecting TCP
    # logins for POSTGRES_USER, so the password is unusable off-container.
    env_file: .env
    volumes:
      - db-data:/var/lib/postgresql/data/
      - type: bind
        source: ./deploy/postgresql/init-db.sh
        target: /docker-entrypoint-initdb.d/init-db.sh
        read_only: true
      - type: bind
        source: ./deploy/postgresql/postgresql.conf
        target: /etc/postgresql/postgresql.conf
        read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - net
    # Lets the app and API containers wait for a ready postgres instead of
    # starting against a socket that is not accepting connections yet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    container_name: api
    image: lemur-api:latest
    pull_policy: never
    restart: always
    # Only the runtime credentials -- deliberately not env_file: .env, which
    # would also hand this container POSTGRES_PASSWORD and LEMUR_DB_OWNER_PASSWORD.
    # Compose still reads .env for the ${...} substitutions below.
    environment:
      LEMUR_DB_HOST: ${LEMUR_DB_HOST}
      LEMUR_DB_NAME: ${LEMUR_DB_NAME}
      LEMUR_DB_USER: ${LEMUR_DB_USER}
      LEMUR_DB_PASSWORD: ${LEMUR_DB_PASSWORD}
      LEMUR_DB_PORT: ${LEMUR_DB_PORT}
    # gunicorn, not `flask run`: Flask's built-in server is a development
    # server -- single-threaded and not written to face hostile input.
    # gunicorn is already pinned in deploy/api/requirements.txt.
    # Flask-Limiter's 30/minute uses in-process storage, so with more than
    # one worker each holds its own counter and the effective rate is
    # workers x 30. It is a coarse burst guard only; the authoritative limit
    # is the per-day counter in api_requests, which lives in the database and
    # is therefore shared. Give Flask-Limiter a shared backend if that
    # per-minute figure ever needs to be exact.
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "--access-logfile", "-", "app:app"]
    build: ./deploy/api/
    volumes: []
    ports:
      - 127.0.0.1:5000:5000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  net:

volumes:
  db-data:
