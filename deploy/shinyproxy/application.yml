proxy:
  title: Open Analytics Shiny Proxy
  port: 8080
  authentication: none
  hide-navbar: true
  docker:
      internal-networking: true
      container-protocol: http
  specs:
  - id: lemur
    display-name: Life Expectancy Monitor
    description: Life Expectancy Monitor
    container-cmd: ["R", "-e", "options('shiny.port'=3838,shiny.host='0.0.0.0');library(lemur);lemur::run_app(serverMode=T)"]
    container-image: lemur_shiny
    container-network: lemur_net
    container-log-path: ./container-logs
    # Forward the database credentials into the app containers ShinyProxy
    # spawns. ShinyProxy 2.6.0 binds container-env as a map of NAME -> VALUE
    # (verified in ShinyProxySpecProvider: getContainerEnv() returns
    # Map<String, String>). Values come from ShinyProxy's own environment,
    # which docker-compose fills from .env (see the shinyproxy service). If
    # LEMUR_DB_PASSWORD is missing, the app refuses to start with a clear
    # error naming the variable.
    container-env:
      LEMUR_DB_HOST: ${LEMUR_DB_HOST}
      LEMUR_DB_NAME: ${LEMUR_DB_NAME}
      LEMUR_DB_USER: ${LEMUR_DB_USER}
      LEMUR_DB_PASSWORD: ${LEMUR_DB_PASSWORD}
      LEMUR_DB_PORT: ${LEMUR_DB_PORT}
logging:
  file:
    shinyproxy.log



