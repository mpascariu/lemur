proxy:
  title: Open Analytics Shiny Proxy
  port: 8080
  authentication: none
  hide-navbar: true
  docker:
      internal-networking: true
      container-protocol: http
  specs:
  - id: lemur
    display-name: Life Expectancy Monitor
    description: Life Expectancy Monitor
    container-cmd: ["R", "-e", "options('shiny.port'=3838,shiny.host='0.0.0.0');library(lemur);lemur::run_app(serverMode=T)"]
    container-image: lemur_shiny
    container-network: lemur_net
    container-log-path: ./container-logs
    # Forward the database credentials into the app containers ShinyProxy
    # spawns. Values come from ShinyProxy's own environment, which
    # docker-compose fills from .env (see the shinyproxy service). If
    # LEMUR_DB_PASSWORD is missing, the app refuses to start with a clear
    # error naming the variable.
    container-env:
      - name: LEMUR_DB_HOST
        value: ${LEMUR_DB_HOST}
      - name: LEMUR_DB_NAME
        value: ${LEMUR_DB_NAME}
      - name: LEMUR_DB_USER
        value: ${LEMUR_DB_USER}
      - name: LEMUR_DB_PASSWORD
        value: ${LEMUR_DB_PASSWORD}
      - name: LEMUR_DB_PORT
        value: ${LEMUR_DB_PORT}
logging:
  file:
    shinyproxy.log



