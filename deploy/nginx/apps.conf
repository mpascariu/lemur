map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

# Drop requests that do not name a host we serve. Without a catch-all the first
# server block becomes the implicit default, so a request carrying any Host
# header reaches ShinyProxy and that header is relayed to its Undertow -- the
# input for Host-validation bugs such as CVE-2025-12543. $host below is the
# client's value, not a validated one; this block is what bounds it.
# 444 closes the connection without a response.
#
# If nginx is run on the host rather than in this container, note that a distro
# nginx.conf usually ships its own "listen 80 default_server"; comment that one
# out or nginx will refuse to start with "a duplicate default server".
server {
   listen                80 default_server;
   server_name           _;
   return                444;
}

server {
   listen                80;
   server_name           life-expectancy.org 3.10.114.240 127.0.0.1;
   server_tokens         off;
   root                  /var/www/html;
   index                 index.html;

   access_log            /var/log/nginx/shinyproxy.access.log;
   error_log             /var/log/nginx/shinyproxy.error.log error;

   location / {
       proxy_pass          http://localhost:8080/app_direct/lemur/;

       proxy_http_version 1.1;
       proxy_set_header Upgrade $http_upgrade;
       proxy_set_header Connection $connection_upgrade;
       proxy_read_timeout 600s;
       proxy_send_timeout 600s;

       proxy_redirect    off;
       proxy_set_header  Host              $host;
       proxy_set_header  X-Real-IP         $remote_addr;
       proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
       proxy_set_header  X-Forwarded-Proto $scheme;
   }
   
   location /api/v1 {
       proxy_pass          http://localhost:5000/;

       proxy_http_version 1.1;
       proxy_set_header Upgrade $http_upgrade;
       proxy_set_header Connection $connection_upgrade;
       proxy_read_timeout 600s;
       proxy_send_timeout 600s;

       proxy_redirect    off;
       proxy_set_header  Host              $host;
       proxy_set_header  X-Real-IP         $remote_addr;
       proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
       proxy_set_header  X-Forwarded-Proto $scheme;
   }

}


